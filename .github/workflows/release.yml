# Publishes a GitHub release with the bridge built for each platform, plus
# SHA256SUMS. The tray app's updater reads these assets (bridge/src/update.rs),
# so keep the asset names in sync with `update::asset_name`.
#
# Two ways to start it:
#   - Actions > Release > Run workflow, with a version like 0.2.0
#     (or `gh workflow run release.yml -f version=0.2.0`): bumps the version
#     in bridge/Cargo.toml, Cargo.lock and package.json, commits, tags and releases.
#   - Push a tag `vX.Y.Z` whose version matches bridge/Cargo.toml.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Releases come from the default branch
        if: github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch
        run: |
          echo "::error::Run the release from ${{ github.event.repository.default_branch }}"
          exit 1
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.3, not '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Bump, commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" bridge/Cargo.toml
          cargo update --workspace --manifest-path bridge/Cargo.toml
          npm pkg set version="$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION"
          fi
          git tag -a "v$VERSION" -m "t3wow $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
      - name: Tag matches Cargo.toml
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' bridge/Cargo.toml | head -1)
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::Tag v$VERSION does not match bridge/Cargo.toml version $cargo_version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: .exe }
          # The oldest supported runners, for the widest glibc compatibility.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path bridge/Cargo.toml
      - name: Name the binary
        shell: bash
        run: |
          mkdir dist
          cp "bridge/target/${{ matrix.target }}/release/t3wow${{ matrix.ext }}" "dist/t3wow-${{ matrix.target }}${{ matrix.ext }}"
      - name: Sign (ad hoc)
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/t3wow-${{ matrix.target }}
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: dist/t3wow-${{ matrix.target }}${{ matrix.ext }} version
      - name: Check the Windows version info
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $info = (Get-Item "dist/t3wow-${{ matrix.target }}.exe").VersionInfo
          $info | Format-List ProductName, FileDescription, ProductVersion, CompanyName
          if ($info.ProductName -ne 'T3 WoW') { throw 'The executable has no version resource' }
      - uses: actions/upload-artifact@v4
        with:
          name: t3wow-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum t3wow-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "t3wow $TAG" \
            --generate-notes \
            --verify-tag
