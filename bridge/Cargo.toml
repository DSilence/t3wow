[package]
name = "t3wow"
version = "0.1.0"
edition = "2024"
description = "Drive a remote T3 Code environment from inside World of Warcraft"
license = "MIT"
repository = "https://github.com/DSilence/t3wow"
publish = false

[[bin]]
name = "t3wow"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
jpeg-decoder = { version = "0.3.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", default-features = false }

[features]
default = ["tls"]
# HTTPS for T3 Connect and Tailscale addresses. Only off for cross-target checks
# (`cargo check --no-default-features --target ...`), which skips ring's C build.
tls = ["ureq/rustls"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# The tray app (macOS menu bar, Windows notification area).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tao = "0.37.1"
tray-icon = "0.26.1"

# Start Menu shortcut and opening links without PowerShell or rundll32.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Version info, icon and manifest in t3wow.exe (build.rs).
[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
jpeg-encoder = "0.7.1"
mlua = { version = "0.12.2", features = ["lua51", "vendored"] }
tiny_http = "0.12.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
